<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои торги</title>
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#1b2430;--mute:#68717d;--line:#d9dde3;--accent:#1f4fd8;--warn:#c2410c;--ok:#15803d;--soft:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
textarea{resize:vertical;min-height:60px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:10px 22px;font-weight:600;background:transparent;color:var(--mute);margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);background:#fff}
.tabs small{font-weight:400;margin-left:6px}
.bar{display:flex;gap:8px;margin-bottom:16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.sec>summary{padding:14px 16px;font-weight:600;font-size:1.05rem;cursor:pointer}
.sec>summary small{color:var(--mute);font-weight:400;margin-left:6px}
.sb{padding:0 16px 16px}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 12px}
.lot{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:10px}
.lot.soon{border-left-color:var(--warn)}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lot h3{margin:0;font-size:1.05rem}
.lot a{color:var(--accent)}
.site{color:var(--mute);font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:8px 0}
.facts div{font-size:.95rem}
.facts span{display:block;color:var(--mute);font-size:.8rem}
.soon .dl{color:var(--warn);font-weight:600}
.note{white-space:pre-wrap;font-size:.92rem;margin-top:6px}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.act select{width:auto;padding:6px}
.act button{padding:6px 10px}
table{border-collapse:collapse;font-size:.9rem;margin-top:6px;width:100%;max-width:360px}
td,th{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left}
tr.cur td{background:#e3ebff;font-weight:600}
.sched summary{cursor:pointer;color:var(--accent);font-size:.92rem}
.empty{color:var(--mute);margin:12px 0 0}
.tools{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(600px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(20,28,40,.45)}
#f{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#f .wide{grid-column:1/-1}
#f h2{margin:0;font-size:1.2rem}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.gen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.btns{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:560px){#f{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Мои торги</h1>
  <p class="sub">Три вкладки, в каждой по четыре списка для отслеживания лотов. Данные хранятся в вашем браузере.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="bar"><input id="q" type="search" placeholder="Поиск по названию, сайту и заметкам"></div>
  <div id="secs"></div>
  <div class="tools">
    <button id="exp" type="button">Скачать резервную копию</button>
    <button id="imp" type="button">Загрузить из копии</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</main>

<dialog id="dlg">
<form id="f">
  <h2 class="wide" id="ft">Новый лот</h2>
  <label>Вкладка
    <select id="own"></select>
  </label>
  <label>Список
    <select id="cat"></select>
  </label>
  <label class="wide">Название лота
    <input id="title" required placeholder="Например: нежилое помещение, ул. Садовая, 5">
  </label>
  <label>Сайт (площадка)
    <select id="site"></select>
    <input id="site2" placeholder="Название площадки" hidden style="margin-top:6px">
  </label>
  <label>Ссылка на лот
    <input id="url" type="url" placeholder="https://…">
  </label>
  <label>Начальная цена, ₽
    <input id="price" type="number" min="0" step="any">
  </label>
  <label>Задаток, ₽
    <input id="deposit" type="number" min="0" step="any">
  </label>
  <label class="wide">Окончание приёма заявок
    <input id="deadline" type="datetime-local">
  </label>
  <div class="wide">
    <label>График снижения цены (по необходимости)</label>
    <div id="rows"></div>
    <button type="button" id="addrow">+ Шаг графика</button>
    <details style="margin-top:8px">
      <summary>Заполнить график автоматически</summary>
      <div class="gen">
        <label>Начало первого шага<input id="g-date" type="datetime-local"></label>
        <label>Цена на старте, ₽<input id="g-price" type="number" min="0" step="any"></label>
        <label>Снижение за шаг, ₽<input id="g-step" type="number" min="0" step="any"></label>
        <label>Шаг, дней<input id="g-days" type="number" min="1" value="7"></label>
        <label>Число шагов<input id="g-n" type="number" min="1" max="100" value="10"></label>
      </div>
      <button type="button" id="gen" style="margin-top:8px">Заполнить</button>
    </details>
  </div>
  <label class="wide">Заметки
    <textarea id="notes"></textarea>
  </label>
  <div class="wide btns">
    <button type="button" id="cancel">Отмена</button>
    <button class="primary" type="submit">Сохранить</button>
  </div>
</form>
</dialog>

<script>
const CATS = [
  {id:'a', name:'Госторги: ждём снижения цены', hint:'Торги, в которых нужно дождаться снижения цены.'},
  {id:'b', name:'Публичные предложения', hint:'Лоты с графиком снижения цены. Текущая цена считается по графику.'},
  {id:'c', name:'Аукционы: ждём публичного предложения', hint:'Когда аукцион не состоялся и стало публичное предложение, перенесите лот в список «Публичные предложения».'},
  {id:'d', name:'Арестованное имущество', hint:'Торги арестованным имуществом.'}
];
const KEY = 'lots-v2';
let lots = load(), editId = null;
const PEOPLE = [{id:'n', name:'Надя'}, {id:'i', name:'Ира'}, {id:'l', name:'Лина'}];
lots.forEach(l => { if (!l.owner) l.owner = 'n'; });
let active = 'n';
try { const t = localStorage.getItem('tab-v1'); if (PEOPLE.some(p => p.id === t)) active = t; } catch(e){}

function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return v; } catch(e){}
  try {
    const o = JSON.parse(localStorage.getItem('lots-v1'));
    if (Array.isArray(o)) return o.map(l => ({id:l.id, cat:'a', title:l.title, site:'', url:l.url||'', price:l.price||'', deposit:'', deadline:l.deadline||'', schedule:[], notes:l.note||''}));
  } catch(e){}
  return [];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(lots)); } catch(e){} }
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
const has = v => v !== '' && v != null && !isNaN(Number(v));
const money = v => has(v) ? Number(v).toLocaleString('ru-RU') + ' ₽' : '—';
const fmt = ts => new Date(ts).toLocaleString('ru-RU', {dateStyle:'medium', timeStyle:'short'});
const pad = n => String(n).padStart(2, '0');
const toLocal = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());

function remaining(ts){
  if (!ts) return null;
  const ms = new Date(ts) - Date.now();
  if (ms <= 0) return {text:'приём заявок завершён', soon:false};
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  return {text: d >= 1 ? 'осталось ' + d + ' дн. ' + (h % 24) + ' ч' : 'осталось ' + h + ' ч', soon: ms < 864e5 * 2};
}

function priceInfo(l){
  const s = (l.schedule || []).filter(r => r.date && has(r.price)).sort((a, b) => a.date < b.date ? -1 : 1);
  const now = new Date();
  let cur = null, next = null;
  for (const r of s){ if (new Date(r.date) <= now) cur = r; else { next = r; break; } }
  return {s, cur, next};
}

function fact(label, value, cls){
  const d = el('div'); d.append(el('span', null, label));
  const v = el('b', cls, value); v.style.fontWeight = 'normal'; d.append(v); return d;
}

function card(l){
  const r = remaining(l.deadline), p = priceInfo(l);
  const c = el('div', 'lot' + (r && r.soon ? ' soon' : ''));
  const top = el('div', 'top');
  const left = el('div');
  const h = el('h3');
  if (l.url){ const a = el('a', null, l.title); a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; h.append(a); } else h.textContent = l.title;
  left.append(h);
  if (l.site) left.append(el('div', 'site', l.site));
  const act = el('div', 'act');
  const ed = el('button', null, 'Изменить'); ed.onclick = () => openDlg(l.cat, l);
  const del = el('button', null, 'Удалить');
  del.onclick = () => { if (confirm('Удалить лот «' + l.title + '»?')){ lots = lots.filter(x => x.id !== l.id); save(); render(); } };
  const mv = document.createElement('select');
  mv.setAttribute('aria-label', 'Перенести в другой список');
  mv.add(new Option('Перенести в…', ''));
  CATS.filter(x => x.id !== l.cat).forEach(x => mv.add(new Option(x.name, x.id)));
  mv.onchange = () => { if (mv.value){ l.cat = mv.value; save(); render(); } };
  act.append(ed, del, mv);
  top.append(left, act);
  c.append(top);

  const facts = el('div', 'facts');
  facts.append(fact('Начальная цена', money(l.price)));
  if (p.s.length) facts.append(fact('Цена сейчас по графику', p.cur ? money(p.cur.price) : money(l.price)));
  facts.append(fact('Задаток', money(l.deposit)));
  if (l.deadline){
    const dl = el('div'); dl.append(el('span', null, 'Приём заявок до'));
    dl.append(el('b', 'dl', fmt(l.deadline) + (r ? ', ' + r.text : ''))); dl.lastChild.style.fontWeight = r && r.soon ? '600' : 'normal';
    facts.append(dl);
  }
  c.append(facts);

  if (p.s.length){
    if (p.next) c.append(el('div', 'site', 'Следующее снижение: ' + fmt(p.next.date) + ', до ' + money(p.next.price)));
    const det = el('details', 'sched');
    det.append(el('summary', null, 'График снижения (шагов: ' + p.s.length + ')'));
    const t = el('table');
    const hr = el('tr'); ['Дата', 'Цена'].forEach(x => hr.append(el('th', null, x))); t.append(hr);
    p.s.forEach(s => {
      const tr = el('tr', s === p.cur ? 'cur' : '');
      tr.append(el('td', null, fmt(s.date)), el('td', null, money(s.price)));
      t.append(tr);
    });
    det.append(t); c.append(det);
  }
  if (l.notes) c.append(el('div', 'note', l.notes));
  return c;
}

function renderTabs(){
  const box = $('tabs'); box.textContent = '';
  PEOPLE.forEach(p => {
    const b = el('button', null, p.name); b.type = 'button';
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', p.id === active ? 'true' : 'false');
    b.append(el('small', null, '(' + lots.filter(l => l.owner === p.id).length + ')'));
    b.onclick = () => { active = p.id; try { localStorage.setItem('tab-v1', active); } catch(e){} render(); };
    box.append(b);
  });
}

function render(){
  renderTabs();
  const q = $('q').value.trim().toLowerCase();
  const openState = {};
  document.querySelectorAll('#secs details.sec').forEach(d => openState[d.dataset.cat] = d.open);
  const box = $('secs'); box.textContent = '';
  for (const cat of CATS){
    const items = lots.filter(l => l.owner === active && l.cat === cat.id && (!q || ((l.title||'') + ' ' + (l.site||'') + ' ' + (l.notes||'')).toLowerCase().includes(q)))
      .sort((a, b) => (a.deadline || '9999') < (b.deadline || '9999') ? -1 : 1);
    const d = el('details', 'sec'); d.dataset.cat = cat.id;
    d.open = cat.id in openState ? openState[cat.id] : true;
    const s = el('summary', null, cat.name); s.append(el('small', null, '(' + items.length + ')'));
    d.append(s);
    const body = el('div', 'sb');
    body.append(el('p', 'hint', cat.hint));
    const add = el('button', 'primary', '+ Добавить лот'); add.onclick = () => openDlg(cat.id);
    body.append(add);
    if (!items.length) body.append(el('p', 'empty', q ? 'Ничего не найдено.' : 'В этом списке пока пусто.'));
    items.forEach(l => body.append(card(l)));
    d.append(body); box.append(d);
  }
}

function addRow(date, price){
  const r = el('div', 'row');
  const a = document.createElement('input'); a.type = 'datetime-local'; a.value = date || '';
  const b = document.createElement('input'); b.type = 'number'; b.min = '0'; b.step = 'any'; b.placeholder = 'Цена, ₽'; b.value = price == null ? '' : price;
  const x = el('button', null, '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Убрать шаг'); x.onclick = () => r.remove();
  r.append(a, b, x); $('rows').append(r);
}

function openDlg(cat, lot){
  editId = lot ? lot.id : null;
  $('ft').textContent = lot ? 'Изменить лот' : 'Новый лот';
  $('cat').value = cat;
  $('own').value = lot ? lot.owner : active;
  for (const k of ['title', 'url', 'price', 'deposit', 'deadline', 'notes']) $(k).value = lot && lot[k] != null ? lot[k] : '';
  const st = lot && lot.site ? lot.site : '';
  if (!st || SITES.includes(st)){ $('site').value = st; $('site2').value = ''; }
  else { $('site').value = '__other'; $('site2').value = st; }
  $('site2').hidden = $('site').value !== '__other';
  $('rows').textContent = '';
  ((lot && lot.schedule) || []).forEach(s => addRow(s.date, s.price));
  $('dlg').showModal();
}

CATS.forEach(c => $('cat').add(new Option(c.name, c.id)));
PEOPLE.forEach(p => $('own').add(new Option(p.name, p.id)));
const SITES = ['Torgi.gov', 'Tbankrot', 'Фабрикант', 'Сбербанк АСТ', 'Альфалот', 'Федресурс', 'Lot-online (РАД)', 'МЭТС', 'ЭТП ГПБ'];
$('site').add(new Option('Не выбрана', ''));
SITES.forEach(x => $('site').add(new Option(x, x)));
$('site').add(new Option('Другая площадка…', '__other'));
$('site').onchange = () => { $('site2').hidden = $('site').value !== '__other'; if (!$('site2').hidden) $('site2').focus(); };
$('addrow').onclick = () => addRow();
$('cancel').onclick = () => $('dlg').close();
$('gen').onclick = () => {
  const start = $('g-date').value, p0 = Number($('g-price').value), st = Number($('g-step').value);
  const days = Number($('g-days').value) || 7, n = Math.min(100, Number($('g-n').value) || 0);
  if (!start || !has($('g-price').value) || !n){ alert('Укажите дату начала, цену на старте и число шагов.'); return; }
  $('rows').textContent = '';
  for (let i = 0; i < n; i++){
    const d = new Date(start); d.setDate(d.getDate() + i * days);
    addRow(toLocal(d), Math.max(0, Math.round((p0 - i * st) * 100) / 100));
  }
};

$('f').onsubmit = e => {
  e.preventDefault();
  const schedule = [...document.querySelectorAll('#rows .row')]
    .map(r => ({date: r.children[0].value, price: r.children[1].value}))
    .filter(s => s.date && s.price !== '');
  const data = {owner: $('own').value, cat: $('cat').value, title: $('title').value.trim(), site: $('site').value === '__other' ? $('site2').value.trim() : $('site').value, url: $('url').value.trim(),
    price: $('price').value, deposit: $('deposit').value, deadline: $('deadline').value, schedule, notes: $('notes').value.trim()};
  if (editId){ lots = lots.map(l => l.id === editId ? Object.assign(l, data) : l); }
  else lots.push(Object.assign({id: Date.now() + Math.random().toString(36).slice(2, 6)}, data));
  save(); $('dlg').close(); render();
};
$('q').oninput = render;

$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(lots, null, 2)], {type:'application/json'}));
  a.download = 'torgi-backup.json'; a.click();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => {
    try {
      const data = JSON.parse(t); if (!Array.isArray(data)) throw 0;
      if (confirm('Заменить текущие лоты (' + lots.length + ') лотами из файла (' + data.length + ')?')){ lots = data.map(l => l.owner ? l : Object.assign(l, {owner:'n'})); save(); render(); }
    } catch(err){ alert('Не удалось прочитать файл. Нужна резервная копия, скачанная с этого сайта.'); }
    e.target.value = '';
  });
};

setInterval(() => { if (!$('dlg').open) render(); }, 6e4);
render();
</script>
</body>
</html>
