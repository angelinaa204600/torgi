<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои лоты</title>
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#1b2430;--mute:#68717d;--line:#d9dde3;--accent:#1f4fd8;--warn:#c2410c;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
form,.lot{background:var(--card);border:1px solid var(--line);border-radius:8px}
form{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form .wide{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
textarea{resize:vertical;min-height:52px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 12px;align-items:center}
.bar input{flex:1 1 180px;width:auto}
.bar select{width:auto}
.count{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.lot{padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;border-left:4px solid var(--line)}
.lot.soon{border-left-color:var(--warn)}
.lot.won{border-left-color:var(--ok)}
.lot h3{margin:0;font-size:1.05rem}
.lot a{color:var(--accent)}
.meta{color:var(--mute);font-size:.9rem}
.left{font-weight:600}
.soon .left{color:var(--warn)}
.note{grid-column:1/-1;font-size:.92rem;white-space:pre-wrap}
.act{display:flex;gap:6px;align-items:flex-start}
.act select{width:auto;padding:6px}
.act button{padding:6px 10px}
.empty{text-align:center;color:var(--mute);padding:32px 0}
.tools{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:560px){form{grid-template-columns:1fr}.lot{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Мои лоты</h1>
  <p class="sub">Личный список торгов. Данные хранятся в вашем браузере.</p>

  <form id="f">
    <label class="wide">Название лота
      <input id="title" required placeholder="Например: квартира, ул. Садовая, 5">
    </label>
    <label class="wide">Ссылка на лот
      <input id="url" type="url" placeholder="https://…">
    </label>
    <label>Начальная цена
      <input id="price" type="number" min="0" step="any">
    </label>
    <label>Окончание торгов
      <input id="deadline" type="datetime-local">
    </label>
    <label>Статус
      <select id="status"></select>
    </label>
    <label class="wide">Заметка
      <textarea id="note"></textarea>
    </label>
    <div class="wide"><button class="primary" type="submit">Добавить лот</button></div>
  </form>

  <div class="bar">
    <input id="q" type="search" placeholder="Поиск по названию и заметкам">
    <select id="flt"></select>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>

  <div class="tools">
    <button id="exp" type="button">Скачать резервную копию</button>
    <button id="imp" type="button">Загрузить из копии</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</main>

<script>
const STATUSES = {watch:'Слежу', bid:'Участвую', won:'Выиграл', lost:'Не выиграл'};
const KEY = 'lots-v1';
let lots = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(lots)); } catch(e){}
}
const $ = id => document.getElementById(id);

function fillSelect(sel, withAll){
  if (withAll) sel.add(new Option('Все статусы', ''));
  for (const k in STATUSES) sel.add(new Option(STATUSES[k], k));
}
fillSelect($('status'), false);
fillSelect($('flt'), true);

function remaining(ts){
  if (!ts) return null;
  const ms = new Date(ts) - Date.now();
  if (ms <= 0) return {text:'торги завершены', soon:false};
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  const text = d >= 1 ? 'осталось ' + d + ' дн. ' + (h % 24) + ' ч' : 'осталось ' + h + ' ч';
  return {text, soon: ms < 864e5 * 2};
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render(){
  const q = $('q').value.trim().toLowerCase(), f = $('flt').value;
  const shown = lots
    .filter(l => (!f || l.status === f) && (!q || (l.title + ' ' + l.note).toLowerCase().includes(q)))
    .sort((a, b) => (a.deadline || '9999') < (b.deadline || '9999') ? -1 : 1);
  const box = $('list');
  box.textContent = '';
  $('count').textContent = 'Показано: ' + shown.length + ' из ' + lots.length;
  if (!shown.length){
    box.append(el('p', 'empty', lots.length ? 'Ничего не найдено. Измените поиск или фильтр.' : 'Список пуст. Добавьте первый лот в форме выше.'));
    return;
  }
  for (const l of shown){
    const r = remaining(l.deadline);
    const card = el('div', 'lot' + (r && r.soon && l.status !== 'won' ? ' soon' : '') + (l.status === 'won' ? ' won' : ''));
    const left = el('div');
    const h = el('h3');
    if (l.url){ const a = el('a', null, l.title); a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; h.append(a); }
    else h.textContent = l.title;
    left.append(h);
    const meta = el('div', 'meta');
    const parts = [];
    if (l.price !== '' && l.price != null) parts.push(Number(l.price).toLocaleString('ru-RU') + ' ₽');
    if (l.deadline) parts.push('до ' + new Date(l.deadline).toLocaleString('ru-RU', {dateStyle:'medium', timeStyle:'short'}));
    meta.textContent = parts.join(', ');
    if (r){ meta.append(' '); meta.append(el('span', 'left', r.text)); }
    left.append(meta);
    const act = el('div', 'act');
    const s = document.createElement('select');
    fillSelect(s, false);
    s.value = l.status;
    s.setAttribute('aria-label', 'Статус');
    s.onchange = () => { l.status = s.value; save(); render(); };
    const del = el('button', null, 'Удалить');
    del.onclick = () => { if (confirm('Удалить лот «' + l.title + '»?')){ lots = lots.filter(x => x.id !== l.id); save(); render(); } };
    act.append(s, del);
    card.append(left, act);
    if (l.note) card.append(el('div', 'note', l.note));
    box.append(card);
  }
}

$('f').onsubmit = e => {
  e.preventDefault();
  lots.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    title: $('title').value.trim(),
    url: $('url').value.trim(),
    price: $('price').value,
    deadline: $('deadline').value,
    status: $('status').value,
    note: $('note').value.trim()
  });
  save();
  e.target.reset();
  render();
};
$('q').oninput = render;
$('flt').onchange = render;

$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(lots, null, 2)], {type:'application/json'}));
  a.download = 'lots-backup.json';
  a.click();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(t => {
    try {
      const data = JSON.parse(t);
      if (!Array.isArray(data)) throw 0;
      if (confirm('Заменить текущий список (' + lots.length + ') лотами из файла (' + data.length + ')?')){ lots = data; save(); render(); }
    } catch(err){ alert('Не удалось прочитать файл. Нужна резервная копия, скачанная с этого сайта.'); }
    e.target.value = '';
  });
};

setInterval(render, 6e4);
render();
</script>
</body>
</html>
